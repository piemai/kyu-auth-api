<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyu CVV Auth Checker Web</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --danger-color: #f87171;
            --success-color: #34d399;
            --warning-color: #fbbf24;
            --border-color: #334155;
            --table-header: #334155;
            --code-bg: #090d16;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --border-color: #e2e8f0;
            --table-header: #f1f5f9;
            --code-bg: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { width: 100%; max-width: 1100px; }

        /* Auth Gate Modal Overlay */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-card {
            background: var(--card-bg); padding: 36px; border-radius: 16px;
            border: 1px solid var(--border-color); width: 100%; max-width: 420px;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .auth-card h2 { margin-top: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; font-weight: 800; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; background: var(--card-bg); padding: 18px 24px;
            border-radius: 14px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 20px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .header-actions { display: flex; align-items: center; gap: 10px; }

        .card {
            background-color: var(--card-bg); border-radius: 14px; padding: 24px;
            margin-bottom: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: var(--text-muted); }

        textarea, input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid var(--border-color);
            border-radius: 10px; background-color: var(--code-bg); color: var(--text-color);
            font-family: monospace; font-size: 13px; box-sizing: border-box; transition: border-color 0.2s;
        }
        textarea { height: 160px; resize: vertical; }
        textarea:focus, input:focus { outline: none; border-color: var(--primary-color); }

        .stats-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box {
            flex: 1; min-width: 120px; background: var(--code-bg); padding: 16px;
            border-radius: 10px; text-align: center; border: 1px solid var(--border-color);
        }
        .stat-box span { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-box strong { font-size: 22px; font-weight: 800; }
        .stat-live { color: var(--success-color); }
        .stat-dead { color: var(--danger-color); }
        .stat-error { color: var(--warning-color); }

        button {
            background: var(--accent-gradient); color: white; border: none;
            padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px;
            transition: opacity 0.2s, transform 0.1s; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

        .btn-danger { background: var(--danger-color); box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3); }
        .btn-success { background: var(--success-color); box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3); color: #0f172a; font-weight: 700; }
        .btn-secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); box-shadow: none; }
        .btn-secondary:hover { background-color: var(--code-bg); }

        .table-responsive { overflow-x: auto; max-height: 400px; border: 1px solid var(--border-color); border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background-color: var(--table-header); color: var(--text-muted); text-transform: uppercase; font-size: 11px; font-weight: 700; position: sticky; top: 0; }

        .badge-live { color: var(--success-color); font-weight: 800; }
        .badge-dead { color: var(--danger-color); font-weight: 800; }
        .badge-error { color: var(--warning-color); font-weight: 800; }
    </style>
</head>
<body data-theme="dark">
    <!-- Key Gate Modal -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>🔒 Kyu CVV Auth Gate</h2>
            <p id="authSubtitle" style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Enter your active license key to access the checker.</p>
            <input type="text" id="licenseKeyInput" placeholder="KYU-XXXXXX-XXXXXX" style="margin-bottom: 14px; text-align: center; text-transform: uppercase;">
            <button onclick="verifyLicenseKey()" style="width: 100%;">Authenticate Key</button>
            <div id="authError" style="color: var(--danger-color); font-size: 12px; margin-top: 10px;"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1>⚡ Kyu CVV Auth Checker Web</h1>
            </div>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()" style="padding: 10px 14px;">🌙 / ☀️</button>
                <button class="btn-danger" onclick="logoutSession()" style="padding: 10px 14px;">Logout</button>
            </div>
        </header>

        <div class="card">
            <div class="grid-2">
                <div class="form-group">
                    <label for="cardsInput">Cards (Format: cc|mo|yr|cvv)</label>
                    <textarea id="cardsInput" placeholder="453210...|08|28|123"></textarea>
                </div>
                <div class="form-group">
                    <label for="proxiesInput">Proxies (Optional - Leave blank for Proxyless)</label>
                    <textarea id="proxiesInput" placeholder="ip:port or ip:port:user:pass" style="height: 160px;"></textarea>
                </div>
            </div>

            <div style="margin-top: 18px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <div style="max-width: 140px;">
                    <label for="threadsInput">Threads</label>
                    <input type="number" id="threadsInput" min="1" max="50" value="15">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 18px;">
                    <button id="startBtn" onclick="startChecking()">Start Checking</button>
                    <button id="stopBtn" class="btn-danger" onclick="stopChecking()" disabled>Stop Checker</button>
                    <button class="btn-success" onclick="exportLiveCards()">📥 Download live.txt</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Live Results</h3>
            <div id="proxyStatusBanner" style="font-size: 13px; font-weight: 600; color: var(--primary-color); margin-bottom: 12px;"></div>
            
            <div class="stats-bar">
                <div class="stat-box"><span>Total</span><strong id="statTotal">0</strong></div>
                <div class="stat-box"><span>Checked</span><strong id="statChecked">0</strong></div>
                <div class="stat-box"><span>Live</span><strong class="stat-live" id="statLive">0</strong></div>
                <div class="stat-box"><span>Dead</span><strong class="stat-dead" id="statDead">0</strong></div>
                <div class="stat-box"><span>Error</span><strong class="stat-error" id="statError">0</strong></div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Card Details</th>
                            <th>Status</th>
                            <th>Response / Gateway Message</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable">
                        <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">No cards checked yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let expiryInterval = null;

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('kyu_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);

            const savedKey = sessionStorage.getItem('kyu_verified_key');
            const expiresTs = sessionStorage.getItem('kyu_expires_ts');

            if (savedKey) {
                // Verify validity immediately
                verifyActiveSession(savedKey, expiresTs);
            }
        });

        function verifyActiveSession(key, expiresTs) {
            if (expiresTs && expiresTs !== 'null') {
                const nowSec = Math.floor(Date.now() / 1000);
                if (nowSec > parseInt(expiresTs)) {
                    lockCheckerDueToExpired("Your license key has expired. Please enter a valid active key.");
                    return;
                }
            }

            // Start background ticker to lock immediately when expiration hits
            if (expiresTs && expiresTs !== 'null') {
                if (expiryInterval) clearInterval(expiryInterval);
                expiryInterval = setInterval(() => {
                    const currentSec = Math.floor(Date.now() / 1000);
                    if (currentSec > parseInt(expiresTs)) {
                        lockCheckerDueToExpired("Your license session has expired. Access locked.");
                    }
                }, 1000);
            }

            document.getElementById('authOverlay').style.display = 'none';
        }

        function lockCheckerDueToExpired(message) {
            if (expiryInterval) clearInterval(expiryInterval);
            sessionStorage.removeItem('kyu_verified_key');
            sessionStorage.removeItem('kyu_expires_ts');
            
            const overlay = document.getElementById('authOverlay');
            document.getElementById('licenseKeyInput').value = '';
            document.getElementById('authSubtitle').innerText = message;
            document.getElementById('authError').innerText = "Session terminated.";
            overlay.style.display = 'flex';
            if (eventSource) stopChecking();
        }

        function verifyLicenseKey() {
            const key = document.getElementById('licenseKeyInput').value.trim();
            const errDiv = document.getElementById('authError');
            errDiv.innerText = '';

            if (!key) {
                errDiv.innerText = 'Please enter your license key.';
                return;
            }

            const deviceId = navigator.userAgent + navigator.language + screen.width;

            fetch('/verify.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, device_id: deviceId })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    sessionStorage.setItem('kyu_verified_key', key);
                    sessionStorage.setItem('kyu_expires_ts', data.expires_ts || 'null');
                    verifyActiveSession(key, data.expires_ts);
                } else {
                    errDiv.innerText = data.message || 'Invalid or expired key.';
                }
            }).catch(() => {
                errDiv.innerText = 'Server connection error.';
            });
        }

        function logoutSession() {
            sessionStorage.removeItem('kyu_verified_key');
            sessionStorage.removeItem('kyu_expires_ts');
            if (expiryInterval) clearInterval(expiryInterval);
            window.location.reload();
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('kyu_theme', newTheme);
        }

        function startChecking() {
            const cards = document.getElementById('cardsInput').value.trim();
            const proxies = document.getElementById('proxiesInput').value.trim();
            const threads = document.getElementById('threadsInput').value.trim();

            if (!cards) {
                alert('Please enter at least one card in the textarea!');
                return;
            }

            document.getElementById('statTotal').innerText = cards.split('\n').filter(Boolean).length;
            document.getElementById('statChecked').innerText = '0';
            document.getElementById('statLive').innerText = '0';
            document.getElementById('statDead').innerText = '0';
            document.getElementById('statError').innerText = '0';
            document.getElementById('proxyStatusBanner').innerText = '';
            document.getElementById('resultsTable').innerHTML = '';

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            fetch('/api/checker/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cards, proxies, threads })
            }).then(res => {
                if (res.ok) {
                    eventSource = new EventSource('/api/checker/stream');
                    eventSource.onmessage = function(event) {
                        const data = JSON.parse(event.data);
                        if (data.finished) {
                            stopChecking();
                            return;
                        }
                        updateResults(data);
                    };
                } else {
                    alert('Error starting checker.');
                    stopChecking();
                }
            });
        }

        function stopChecking() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            fetch('/api/checker/stop', { method: 'POST' });
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function exportLiveCards() {
            window.location.href = '/api/checker/export';
        }

        function updateResults(data) {
            if (data.status_msg) {
                document.getElementById('proxyStatusBanner').innerText = data.status_msg;
                return;
            }

            const tbody = document.getElementById('resultsTable');
            if (tbody.querySelector('td[colspan]')) {
                tbody.innerHTML = '';
            }

            let badgeClass = 'badge-error';
            if (data.code === 0) badgeClass = 'badge-live';
            else if (data.code === 1) badgeClass = 'badge-dead';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><code>${data.card}</code></td>
                <td><span class="${badgeClass}">${data.status}</span></td>
                <td>${data.detail}</td>
            `;
            tbody.prepend(row);

            document.getElementById('statTotal').innerText = data.total;
            document.getElementById('statChecked').innerText = data.checked;
            document.getElementById('statLive').innerText = data.live;
            document.getElementById('statDead').innerText = data.dead;
            document.getElementById('statError').innerText = data.error;
        }
    </script>
</body>
</html>
