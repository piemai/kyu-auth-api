<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kyu CVV Auth — COAST RTA</title>
    <style>
        :root {
            --bg: #0b0e14;
            --panel: #131820;
            --panel-2: #1a2030;
            --border: #2a3348;
            --text: #e8edf5;
            --muted: #8b97ad;
            --accent: #6d5efc;
            --accent-2: #8b7cff;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
            --code: #0f141c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }
        .brand {
            font-weight: 800;
            font-size: 16px;
            background: linear-gradient(90deg, #6d5efc, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .timer {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
            background: var(--panel-2);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        @media (max-width: 720px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
        .stat {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }
        .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
        .stat strong { display: block; font-size: 22px; margin-top: 4px; }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
        textarea, input[type="number"], input[type="text"] {
            width: 100%;
            background: var(--code);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 13px;
        }
        textarea { height: 140px; resize: vertical; }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 720px) {
            .row { grid-template-columns: 1fr; }
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            align-items: flex-end;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .btn-red { background: var(--red); }
        .btn-green { background: var(--green); }
        .btn-gray { background: #2a3348; }
        .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filters button { background: var(--panel-2); }
        .filters button.active { background: var(--accent); }
        .results {
            max-height: 420px;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--panel-2); color: var(--muted); font-size: 11px; text-transform: uppercase; position: sticky; top: 0; }
        .live { color: var(--green); font-weight: 700; }
        .dead { color: var(--red); font-weight: 700; }
        .err { color: var(--yellow); font-weight: 700; }
        .bin-tag {
            display: inline-block;
            font-size: 11px;
            background: var(--panel-2);
            color: var(--accent-2);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 4px;
        }
        #authOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .auth-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: min(400px, 92vw);
            text-align: center;
        }
        .auth-box h2 { margin: 0 0 8px; color: var(--accent-2); }
        .auth-box p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
        .auth-box input { margin-bottom: 12px; text-align: center; text-transform: uppercase; }
        #authError { color: var(--red); font-size: 12px; min-height: 18px; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="authOverlay">
        <div class="auth-box">
            <h2>COAST RTA Gate</h2>
            <p>Enter your KYU license key to continue.</p>
            <input type="text" id="licenseKeyInput" placeholder="KYU-XXXXXX-XXXXXX">
            <button onclick="verifyLicenseKey()" style="width:100%;">Unlock</button>
            <div id="authError"></div>
        </div>
    </div>

    <div class="topbar">
        <div class="brand">⚡ Kyu · COAST RTA</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <div class="timer">⏳ <span id="userTimeRemaining">--:--:--</span></div>
            <button class="btn-gray" onclick="logoutKey()" style="padding:6px 12px;font-size:12px;">Logout</button>
        </div>
    </div>

    <div class="wrap">
        <div class="stats">
            <div class="stat"><span>Total</span><strong id="statTotal">0</strong></div>
            <div class="stat"><span>Checked</span><strong id="statChecked">0</strong></div>
            <div class="stat"><span>Live</span><strong id="statLive" style="color:var(--green)">0</strong></div>
            <div class="stat"><span>Dead</span><strong id="statDead" style="color:var(--red)">0</strong></div>
            <div class="stat"><span>Error</span><strong id="statError" style="color:var(--yellow)">0</strong></div>
        </div>

        <div class="panel">
            <div class="row">
                <div>
                    <label>Cards (cc|mo|yr|cvv)</label>
                    <textarea id="cardsInput" placeholder="453210...|08|28|123"></textarea>
                </div>
                <div>
                    <label>Proxies (optional)</label>
                    <textarea id="proxiesInput" placeholder="ip:port or ip:port:user:pass"></textarea>
                </div>
            </div>
            <div class="actions">
                <div style="width:90px;">
                    <label>Threads</label>
                    <input type="number" id="threadsInput" min="1" max="20" value="5">
                </div>
                <button id="startBtn" onclick="startChecking()">▶ Start</button>
                <button id="stopBtn" class="btn-red" onclick="stopChecking()" disabled>⏹ Stop</button>
                <button class="btn-green" onclick="exportLiveCards()">Download live.txt</button>
                <button class="btn-gray" onclick="copyAllLiveCards()">Copy Live</button>
                <button class="btn-gray" onclick="clearResults()">Clear</button>
            </div>
            <div id="proxyStatusBanner" style="margin-top:10px;font-size:12px;color:var(--accent-2);"></div>
        </div>

        <div class="panel">
            <div class="filters">
                <button class="active" onclick="setFilter('ALL', this)">All</button>
                <button onclick="setFilter('LIVE', this)">Live</button>
                <button onclick="setFilter('DEAD', this)">Dead</button>
                <button onclick="setFilter('ERROR', this)">Error</button>
            </div>
            <div class="results">
                <table>
                    <thead>
                        <tr>
                            <th>Card</th>
                            <th>BIN</th>
                            <th>Status</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable">
                        <tr><td colspan="4" style="text-align:center;color:var(--muted);">No results yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <audio id="liveSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-notification-951.mp3" type="audio/mpeg">
    </audio>

    <script>
        let pollTimer = null;
        let isPollingInFlight = false;
        const binCache = {};
        let currentFilter = 'ALL';
        let remainingSeconds = null;
        let isLifetime = false;
        let heartbeatTimer = null;
        let secondTicker = null;
        let liveCardsList = [];

        history.pushState(null, null, location.href);
        window.addEventListener('popstate', () => {
            if (sessionStorage.getItem('kyu_verified_key')) {
                history.pushState(null, null, location.href);
            }
        });

        function getDeviceId() {
            return navigator.userAgent + '|' + navigator.language + '|' + screen.width + 'x' + screen.height;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = sessionStorage.getItem('kyu_verified_key');
            if (saved) {
                document.getElementById('licenseKeyInput').value = saved;
                verifyLicenseKey();
            }
        });

        window.addEventListener('beforeunload', () => {
            const key = sessionStorage.getItem('kyu_verified_key');
            if (key) {
                const payload = JSON.stringify({ key, device_id: getDeviceId(), action: 'pause' });
                navigator.sendBeacon('/verify.php', new Blob([payload], { type: 'application/json' }));
            }
        });

        function formatRemainingSeconds(sec) {
            if (isLifetime) return '∞ Lifetime';
            if (sec == null) return '--:--:--';
            if (sec <= 0) return 'Expired';
            const d = Math.floor(sec / 86400);
            const h = Math.floor((sec % 86400) / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (d > 0) return `${d}d ${h}h ${m}m ${s}s`;
            if (h > 0) return `${h}h ${m}m ${s}s`;
            return `${m}m ${s}s`;
        }

        function updateTimerDisplay() {
            const el = document.getElementById('userTimeRemaining');
            el.textContent = formatRemainingSeconds(remainingSeconds);
            el.style.color = (!isLifetime && remainingSeconds != null && remainingSeconds <= 0) ? 'var(--red)' : 'var(--accent-2)';
        }

        function startLicenseHeartbeat() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (secondTicker) clearInterval(secondTicker);

            secondTicker = setInterval(() => {
                if (!isLifetime && remainingSeconds != null && remainingSeconds > 0) {
                    remainingSeconds -= 1;
                    updateTimerDisplay();
                    if (remainingSeconds <= 0) handleExpiredSession('Your license key time has run out!');
                }
            }, 1000);

            heartbeatTimer = setInterval(async () => {
                const key = sessionStorage.getItem('kyu_verified_key');
                if (!key) return;
                try {
                    const res = await fetch('/verify.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key, device_id: getDeviceId(), action: 'ping' })
                    });
                    const data = await res.json();
                    if (!data.success) {
                        handleExpiredSession(data.message || 'License invalid or expired.');
                    } else {
                        isLifetime = data.remaining_seconds === null;
                        remainingSeconds = data.remaining_seconds;
                        updateTimerDisplay();
                    }
                } catch (e) {}
            }, 5000);
        }

        function handleExpiredSession(msg) {
            stopChecking();
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (secondTicker) clearInterval(secondTicker);
            alert(msg);
            sessionStorage.removeItem('kyu_verified_key');
            document.getElementById('authOverlay').style.display = 'flex';
        }

        async function logoutKey() {
            stopChecking();
            const key = sessionStorage.getItem('kyu_verified_key');
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (secondTicker) clearInterval(secondTicker);
            if (key) {
                try {
                    await fetch('/verify.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key, device_id: getDeviceId(), action: 'pause' })
                    });
                } catch (e) {}
            }
            sessionStorage.removeItem('kyu_verified_key');
            remainingSeconds = null;
            isLifetime = false;
            document.getElementById('userTimeRemaining').textContent = '--:--:--';
            document.getElementById('licenseKeyInput').value = '';
            document.getElementById('authError').textContent = '';
            document.getElementById('authOverlay').style.display = 'flex';
        }

        function verifyLicenseKey() {
            const key = document.getElementById('licenseKeyInput').value.trim();
            const err = document.getElementById('authError');
            err.textContent = '';
            if (!key) { err.textContent = 'Enter a key.'; return; }

            fetch('/verify.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key, device_id: getDeviceId(), action: 'ping' })
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    sessionStorage.setItem('kyu_verified_key', key);
                    isLifetime = data.remaining_seconds === null;
                    remainingSeconds = data.remaining_seconds;
                    updateTimerDisplay();
                    document.getElementById('authOverlay').style.display = 'none';
                    startLicenseHeartbeat();
                } else {
                    sessionStorage.removeItem('kyu_verified_key');
                    err.textContent = data.message || 'Invalid or expired key.';
                    document.getElementById('authOverlay').style.display = 'flex';
                }
            }).catch(() => { err.textContent = 'Server error.'; });
        }

        function setFilter(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('#resultsTable tr[data-status]').forEach(row => {
                row.style.display = (status === 'ALL' || row.getAttribute('data-status') === status) ? '' : 'none';
            });
        }

        async function fetchBinInfo(cardLine, cellId) {
            const bin = cardLine.split('|')[0].trim().slice(0, 6);
            if (binCache[bin]) {
                const cell = document.getElementById(cellId);
                if (cell) cell.innerHTML = binCache[bin];
                return;
            }
            try {
                const res = await fetch('/api/bin/' + bin);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.success) {
                        const html = `<span class="bin-tag">${data.scheme}</span><span class="bin-tag">${data.type}</span><br><small>${data.bank}, ${data.country}</small>`;
                        binCache[bin] = html;
                        const cell = document.getElementById(cellId);
                        if (cell) cell.innerHTML = html;
                        return;
                    }
                }
            } catch (e) {}
            const fallback = `<span class="bin-tag">VISA/MC</span><br><small>Unknown</small>`;
            const cell = document.getElementById(cellId);
            if (cell) cell.innerHTML = fallback;
        }

        function playLiveSound() {
            const a = document.getElementById('liveSound');
            if (a) {
                a.currentTime = 0;
                a.play().catch(() => {});
            }
        }

        function copyAllLiveCards() {
            if (!liveCardsList.length) { alert('No live cards yet.'); return; }
            navigator.clipboard.writeText(liveCardsList.join('\n')).then(() => {
                alert('Copied ' + liveCardsList.length + ' live card(s).');
            }).catch(() => alert('Copy failed.'));
        }

        function clearResults() {
            liveCardsList = [];
            ['statTotal','statChecked','statLive','statDead','statError'].forEach(id => document.getElementById(id).textContent = '0');
            document.getElementById('proxyStatusBanner').textContent = '';
            document.getElementById('resultsTable').innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);">No results yet.</td></tr>';
        }

        function startChecking() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            isPollingInFlight = false;

            const cards = document.getElementById('cardsInput').value.trim();
            const proxies = document.getElementById('proxiesInput').value.trim();
            const threads = document.getElementById('threadsInput').value.trim() || '5';
            if (!cards) { alert('Enter at least one card.'); return; }

            liveCardsList = [];
            document.getElementById('statTotal').textContent = cards.split('\n').filter(Boolean).length;
            document.getElementById('statChecked').textContent = '0';
            document.getElementById('statLive').textContent = '0';
            document.getElementById('statDead').textContent = '0';
            document.getElementById('statError').textContent = '0';
            document.getElementById('proxyStatusBanner').textContent = '';
            document.getElementById('resultsTable').innerHTML = '';

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            fetch('/api/checker/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cards, proxies, threads })
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    pollTimer = setInterval(async () => {
                        if (isPollingInFlight) return;
                        isPollingInFlight = true;
                        try {
                            const r = await fetch('/api/checker/poll');
                            const p = await r.json();
                            if (p.success && Array.isArray(p.items)) {
                                for (const item of p.items) {
                                    if (item.finished) { stopChecking(); isPollingInFlight = false; return; }
                                    updateResults(item);
                                }
                            }
                        } catch (e) {}
                        finally { isPollingInFlight = false; }
                    }, 600);
                } else {
                    alert(data.message || 'Could not start checker.');
                    stopChecking();
                }
            }).catch(() => {
                alert('Server error.');
                stopChecking();
            });
        }

        function stopChecking() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            isPollingInFlight = false;
            fetch('/api/checker/stop', { method: 'POST' }).catch(() => {});
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function exportLiveCards() { location.href = '/api/checker/export'; }

        function updateResults(data) {
            if (data.status_msg) {
                document.getElementById('proxyStatusBanner').textContent = data.status_msg;
                return;
            }

            const tbody = document.getElementById('resultsTable');
            if (tbody.querySelector('td[colspan]')) tbody.innerHTML = '';

            let cls = 'err';
            if (data.code === 0) {
                cls = 'live';
                liveCardsList.push(data.card + ' | ' + data.detail);
                playLiveSound();
            } else if (data.code === 1) {
                cls = 'dead';
            }

            const uid = 'bin_' + Math.random().toString(36).slice(2, 9);
            const row = document.createElement('tr');
            row.setAttribute('data-status', data.status);
            row.innerHTML = `
                <td><code>${data.card}</code></td>
                <td id="${uid}"><small style="color:var(--muted);">Loading...</small></td>
                <td><span class="${cls}">${data.status}</span></td>
                <td>${data.detail}</td>
            `;
            if (currentFilter !== 'ALL' && data.status !== currentFilter) row.style.display = 'none';
            tbody.prepend(row);
            fetchBinInfo(data.card, uid);

            document.getElementById('statTotal').textContent = data.total;
            document.getElementById('statChecked').textContent = data.checked;
            document.getElementById('statLive').textContent = data.live;
            document.getElementById('statDead').textContent = data.dead;
            document.getElementById('statError').textContent = data.error;
        }
    </script>
</body>
</html>
