<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Coast RTA Checker</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 100%; max-width: 400px; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin-top: 15px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #3b82f6; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #2563eb; }
        .error { color: #f87171; margin-top: 10px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align: center; margin-top: 0;">LICENSE LOGIN</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="key" placeholder="Enter License Key (e.g. KYU-VIP-2026)" required>
            <button type="submit">ACCESS CHECKER</button>
        </form>
    </div>
</body>
</html>
