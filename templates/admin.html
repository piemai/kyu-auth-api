<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyu Auth - Admin Panel</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --border-color: #e2e8f0;
            --table-header: #f1f5f9;
            --code-bg: #f1f5f9;
            --badge-active-bg: #dcfce7;
            --badge-active-text: #166534;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --danger-color: #f87171;
            --danger-hover: #ef4444;
            --warning-color: #fbbf24;
            --warning-hover: #f59e0b;
            --border-color: #334155;
            --table-header: #334155;
            --code-bg: #334155;
            --badge-active-bg: #064e3b;
            --badge-active-text: #6ee7b7;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], input[type="date"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-warning {
            background-color: var(--warning-color);
            padding: 6px 12px;
            font-size: 12px;
            color: white;
        }
        .btn-warning:hover {
            background-color: var(--warning-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: var(--code-bg);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        th {
            background-color: var(--table-header);
            font-weight: 600;
            color: var(--text-muted);
        }

        .key-text {
            font-family: monospace;
            background-color: var(--code-bg);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background-color: var(--badge-active-bg);
            color: var(--badge-active-text);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body data-theme="light">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container" style="max-width: 400px; margin-top: 80px;">
        <div class="card" style="text-align: center;">
            <h2 style="color: var(--primary-color); margin-bottom: 8px;">Kyu Auth Admin</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Please enter your admin password to sign in.</p>
            <div class="form-group" style="text-align: left;">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" onkeypress="handleLoginEnter(event)">
            </div>
            <button onclick="login()" style="width: 100%;">Sign In</button>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="adminPanel" class="container hidden">
        <header>
            <h1>⚡ Kyu Auth Dashboard</h1>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()">🌙 / ☀️</button>
                <button class="btn-danger" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Form for Create / Update -->
        <div class="card">
            <h3 id="formTitle">Create New License Key</h3>
            <input type="hidden" id="editKeyId" value="">
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="keyOwner">Owner / Client Name</label>
                    <input type="text" id="keyOwner" placeholder="e.g., John Doe">
                </div>
                <div class="form-group">
                    <label for="keyExpire">Expiration Date (Optional)</label>
                    <input type="date" id="keyExpire">
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <button id="saveBtn" onclick="saveKey()">Generate Key</button>
                <button id="cancelBtn" class="btn-secondary hidden" onclick="resetForm()">Cancel</button>
            </div>
        </div>

        <!-- List (Read, Update, Delete) -->
        <div class="card">
            <h3>License Keys List</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Owner</th>
                            <th>License Key</th>
                            <th>Expiration</th>
                            <th>Device Bound</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keyList">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let keys = [];

        if (sessionStorage.getItem('is_logged_in') === 'true') {
            showAdminPanel();
        }

        function handleLoginEnter(e) {
            if (e.key === 'Enter') login();
        }

        async function login() {
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('is_logged_in', 'true');
                    showAdminPanel();
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('Connection error with the server.');
            }
        }

        function logout() {
            sessionStorage.removeItem('is_logged_in');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginPassword').value = '';
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            fetchKeys();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        }

        async function fetchKeys() {
            try {
                const res = await fetch('/api/keys');
                const data = await res.json();
                if (data.success) {
                    keys = data.keys;
                    renderKeys();
                }
            } catch (err) {
                console.error('Error fetching keys:', err);
            }
        }

        function renderKeys() {
            const keyListElement = document.getElementById('keyList');
            keyListElement.innerHTML = '';

            if (keys.length === 0) {
                keyListElement.innerHTML = `<tr><td colspan="6" class="empty-state">No keys found.</td></tr>`;
                return;
            }

            keys.forEach((item) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.owner}</strong></td>
                    <td><span class="key-text">${item.key}</span></td>
                    <td>${item.expire || 'Lifetime'}</td>
                    <td><small style="color: var(--text-muted);">${item.device_id || 'Not bound'}</small></td>
                    <td><span class="badge">${item.status}</span></td>
                    <td>
                        <button class="btn-warning" onclick="editKey('${item.key}', '${item.owner}', '${item.expire}')">Edit</button>
                        <button class="btn-danger" onclick="deleteKey('${item.key}')">Delete</button>
                    </td>
                `;
                keyListElement.appendChild(row);
            });
        }

        async function saveKey() {
            const owner = document.getElementById('keyOwner').value.trim() || 'No Name';
            const expire = document.getElementById('keyExpire').value;
            const editKeyId = document.getElementById('editKeyId').value;

            try {
                if (!editKeyId) {
                    await fetch('/api/keys', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ owner, expire })
                    });
                } else {
                    await fetch(`/api/keys/${encodeURIComponent(editKeyId)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ owner, expire })
                    });
                }
                resetForm();
                fetchKeys();
            } catch (err) {
                alert('Error saving the key.');
            }
        }

        function editKey(key, owner, expire) {
            document.getElementById('keyOwner').value = owner;
            document.getElementById('keyExpire').value = expire ? expire.split(' ')[0] : '';
            document.getElementById('editKeyId').value = key;

            document.getElementById('formTitle').innerText = `Update Key: ${key}`;
            document.getElementById('saveBtn').innerText = "Save Changes";
            document.getElementById('cancelBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('keyOwner').value = '';
            document.getElementById('keyExpire').value = '';
            document.getElementById('editKeyId').value = '';

            document.getElementById('formTitle').innerText = "Create New License Key";
            document.getElementById('saveBtn').innerText = "Generate Key";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        async function deleteKey(key) {
            if (confirm(`Are you sure you want to delete the key "${key}"?`)) {
                try {
                    await fetch(`/api/keys/${encodeURIComponent(key)}`, {
                        method: 'DELETE'
                    });
                    fetchKeys();
                } catch (err) {
                    alert('Error deleting the key.');
                }
            }
        }
    </script>
</body>
</html>
