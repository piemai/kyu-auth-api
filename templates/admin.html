<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Key Manager</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: monospace; padding: 40px; }
        .box { max-width: 700px; margin: auto; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: left; }
        input, button { padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #10b981; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="box">
        <h2>LICENSE KEY MANAGER</h2>
        <form method="POST" action="/admin/add">
            <input type="text" name="key" placeholder="New License Key" required style="width: 60%;">
            <input type="number" name="days" placeholder="Days" value="30" required style="width: 25%;">
            <button type="submit" style="width: 12%;">Add</button>
        </form>
        <table>
            <tr><th>Key</th><th>Status</th><th>Expires</th></tr>
            {% for k, info in keys.items() %}
            <tr>
                <td>{{ k }}</td>
                <td>{{ "Active" if info.active else "Inactive" }}</td>
                <td>{{ info.expires_ts }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
