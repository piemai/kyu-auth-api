<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Key Management Admin Panel</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --border-color: #e5e7eb;
            --table-header: #f9fafb;
            --code-bg: #f3f4f6;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --danger-color: #f87171;
            --danger-hover: #ef4444;
            --warning-color: #fbbf24;
            --warning-hover: #f59e0b;
            --border-color: #374151;
            --table-header: #374151;
            --code-bg: #374151;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            padding: 6px 10px;
            font-size: 12px;
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-warning {
            background-color: var(--warning-color);
            padding: 6px 10px;
            font-size: 12px;
            color: white;
        }
        .btn-warning:hover {
            background-color: var(--warning-hover);
        }

        .btn-secondary {
            background-color: #6b7280;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        th {
            background-color: var(--table-header);
            font-weight: 600;
        }

        .key-text {
            font-family: monospace;
            background-color: var(--code-bg);
            padding: 4px 6px;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }

        /* Hidden helper */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body data-theme="light">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="container" style="max-width: 400px; margin-top: 100px;">
        <div class="card">
            <h2 style="text-align: center; color: var(--primary-color);">Admin Login</h2>
            <p style="text-align: center; font-size: 13px; color: #6b7280;">Password default: <code>admin123</code></p>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="I-type ang password">
            </div>
            <button onclick="login()" style="width: 100%;">Mag-log in</button>
        </div>
    </div>

    <!-- MAIN ADMIN PANEL -->
    <div id="adminPanel" class="container hidden">
        <header>
            <h1>Key Management Dashboard</h1>
            <div class="header-actions">
                <button class="btn-secondary" onclick="toggleTheme()">🌙 / ☀️ Mode</button>
                <button class="btn-danger" onclick="logout()">Logout</button>
            </div>
        </header>

        <!-- Form para sa Create / Update -->
        <div class="card">
            <h3 id="formTitle">Gumawa ng Bagong Key</h3>
            <input type="hidden" id="editIndex" value="-1">
            
            <div class="form-group">
                <label for="keyOwner">Pangalan / May-ari</label>
                <input type="text" id="keyOwner" placeholder="Hal. Juan Dela Cruz">
            </div>
            <div class="form-group">
                <label for="keyExpire">Expiration Date</label>
                <input type="date" id="keyExpire">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button id="saveBtn" onclick="saveKey()">Mag-generate / I-save</button>
                <button id="cancelBtn" class="btn-secondary hidden" onclick="resetForm()">I-cancel</button>
            </div>
        </div>

        <!-- Listahan (Read & Delete / Edit) -->
        <div class="card">
            <h3>Listahan ng mga Active Keys</h3>
            <table>
                <thead>
                    <tr>
                        <th>May-ari</th>
                        <th>Key</th>
                        <th>Expiration</th>
                        <th>Aksyon</th>
                    </tr>
                </thead>
                <tbody id="keyList">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simple Auth & State Management
        let keys = JSON.parse(localStorage.getItem('admin_keys_v2')) || [];
        const DEFAULT_PASSWORD = "admin123";

        // Suriin kung naka-login na
        if (sessionStorage.getItem('is_logged_in') === 'true') {
            showAdminPanel();
        }

        function login() {
            const pass = document.getElementById('loginPassword').value;
            if (pass === DEFAULT_PASSWORD) {
                sessionStorage.setItem('is_logged_in', 'true');
                showAdminPanel();
            } else {
                alert('Maling password! Subukan ang "admin123".');
            }
        }

        function logout() {
            sessionStorage.removeItem('is_logged_in');
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginPassword').value = '';
        }

        function showAdminPanel() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            renderKeys();
        }

        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
            }
        }

        // CRUD Operations
        function renderKeys() {
            const keyListElement = document.getElementById('keyList');
            keyListElement.innerHTML = '';

            if (keys.length === 0) {
                keyListElement.innerHTML = `<tr><td colspan="4" class="empty-state">Wala pang nakatalang key.</td></tr>`;
                return;
            }

            keys.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.owner}</td>
                    <td><span class="key-text">${item.key}</span></td>
                    <td>${item.expire || 'Walang Expiry'}</td>
                    <td>
                        <button class="btn-warning" onclick="editKey(${index})">Edit</button>
                        <button class="btn-danger" onclick="deleteKey(${index})">Delete</button>
                    </td>
                `;
                keyListElement.appendChild(row);
            });
        }

        function saveKey() {
            const ownerInput = document.getElementById('keyOwner');
            const expireInput = document.getElementById('keyExpire');
            const editIndex = document.getElementById('editIndex').value;

            const ownerName = ownerInput.value.trim() || 'Walang Pangalan';
            const expireDate = expireInput.value;

            if (editIndex === "-1") {
                // CREATE
                const randomPart1 = Math.random().toString(36).substring(2, 8).toUpperCase();
                const randomPart2 = Math.random().toString(36).substring(2, 8).toUpperCase();
                const newKey = `KEY-${randomPart1}-${randomPart2}`;

                keys.push({ owner: ownerName, key: newKey, expire: expireDate });
            } else {
                // UPDATE
                keys[editIndex].owner = ownerName;
                keys[editIndex].expire = expireDate;
            }

            localStorage.setItem('admin_keys_v2', JSON.stringify(keys));
            resetForm();
            renderKeys();
        }

        function editKey(index) {
            const item = keys[index];
            document.getElementById('keyOwner').value = item.owner;
            document.getElementById('keyExpire').value = item.expire || '';
            document.getElementById('editIndex').value = index;

            document.getElementById('formTitle').innerText = "I-update ang Key";
            document.getElementById('saveBtn').innerText = "I-save ang Pagbabago";
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('keyOwner').value = '';
            document.getElementById('keyExpire').value = '';
            document.getElementById('editIndex').value = "-1";

            document.getElementById('formTitle').innerText = "Gumawa ng Bagong Key";
            document.getElementById('saveBtn').innerText = "Mag-generate / I-save";
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function deleteKey(index) {
            if (confirm('Sigurado ka bang gusto mong tanggalin ang key na ito?')) {
                keys.splice(index, 1);
                localStorage.setItem('admin_keys_v2', JSON.stringify(keys));
                renderKeys();
            }
        }
    </script>
</body>
</html>
